<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentriZK Architecture Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --sidebar-bg: rgba(255, 255, 255, 0.85);
            --sidebar-border: rgba(255, 255, 255, 0.3);
            --item-hover: #e5e7eb;
            --item-active: #3b82f6;
            --item-active-text: #ffffff;
            --accent: #3b82f6;
            --grid-color: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --sidebar-bg: rgba(30, 41, 59, 0.85);
            --sidebar-border: rgba(255, 255, 255, 0.05);
            --item-hover: #334155;
            --item-active: #3b82f6;
            --item-active-text: #ffffff;
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            /* Academic grid background */
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                              linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Sidebar styling with glassmorphism */
        .sidebar {
            width: 350px;
            height: 100vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 24px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--sidebar-border);
        }

        .sidebar-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-header p {
            font-size: 13px;
            opacity: 0.7;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--sidebar-border);
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            flex: 1;
        }

        button:hover {
            background: var(--item-hover);
        }

        .diagram-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .diagram-list::-webkit-scrollbar {
            width: 6px;
        }
        .diagram-list::-webkit-scrollbar-thumb {
            background: var(--item-hover);
            border-radius: 10px;
        }

        .diagram-item {
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .diagram-item:hover {
            background: var(--item-hover);
        }

        .diagram-item.active {
            background: var(--item-active);
            color: var(--item-active-text);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .diagram-item::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.5;
        }
        .diagram-item.active::before {
            opacity: 1;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        /* Main presentation area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 24px;
            overflow: hidden;
        }

        .diagram-title-display {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .viewer-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--sidebar-bg);
            border-radius: 16px;
            border: 1px solid var(--sidebar-border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px;
        }

        #diagram-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
            cursor: zoom-in;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1));
        }

        #diagram-img.zoomed {
            transform: scale(1.5);
            cursor: zoom-out;
        }

        /* Fullscreen modal */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .fullscreen-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .fullscreen-overlay img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(0,0,0,0.1);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .close-btn:hover {
            background: rgba(0,0,0,0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body data-theme="light">

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>SentriZK</h1>
            <p>Academic Presentation Deck</p>
            <div class="controls">
                <button onclick="toggleTheme()" id="theme-btn">🌙 Dark Mode</button>
                <button onclick="openFullscreen()">⛶ Fullscreen</button>
            </div>
        </div>
        <div class="diagram-list" id="diagram-list">
            <!-- Dynamically populated -->
        </div>
    </div>

    <div class="main-content">
        <h2 class="diagram-title-display" id="display-title">Select a Diagram</h2>
        <div class="viewer-container">
            <img id="diagram-img" src="" alt="Diagram Viewer" onclick="toggleZoom(this)" style="display: none;">
        </div>
    </div>

    <!-- Fullscreen Presentation Overlay -->
    <div class="fullscreen-overlay" id="fs-overlay">
        <button class="close-btn" onclick="closeFullscreen()">×</button>
        <img id="fs-img" src="" alt="Fullscreen Diagram">
    </div>

    <script>
        const diagrams = [
            "Full System Architecture Overview.png",
            "Activity Diagram Secure User Onboarding & Key Generation.png",
            "ZKP Registration Flow.png",
            "ZKP Login Flow.png",
            "Signal Protocol E2EE Messaging.png",
            "Activity Diagram Real-Time Chat & Offline Synchronization.png",
            "WebRTC AudioVideo Call Flow.png",
            "TFLite ML Threat Detection Pipeline.png",
            "Phishing Detection Architecture.png",
            "Firebase Architecture.png",
            "Component Diagram Flutter Mobile Application.png",
            "Admin Panel.png",
            "Session Lifecycle & Security.png",
            "Cryptographic Stack Flow.png",
            "Receiver Security Flow.png",
            "Sender & Cloud Flow.png",
            "architecture.png",
            "flowchart_auth.png"
        ];

        const listContainer = document.getElementById('diagram-list');
        const imgDisplay = document.getElementById('diagram-img');
        const titleDisplay = document.getElementById('display-title');
        const fsOverlay = document.getElementById('fs-overlay');
        const fsImg = document.getElementById('fs-img');
        const themeBtn = document.getElementById('theme-btn');

        let currentImgSrc = '';

        // Initialize sidebar list
        diagrams.forEach((filename, index) => {
            const div = document.createElement('div');
            div.className = 'diagram-item';
            
            // Clean up name for display
            let displayName = filename.replace('.png', '');
            
            div.textContent = displayName;
            div.onclick = () => loadDiagram(filename, displayName, div);
            listContainer.appendChild(div);

            // Load first by default
            if (index === 0) {
                loadDiagram(filename, displayName, div);
            }
        });

        function loadDiagram(filename, title, element) {
            // Update active state
            document.querySelectorAll('.diagram-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            // Load image
            const srcPath = `Diagram/${filename}`;
            currentImgSrc = srcPath;
            
            imgDisplay.src = srcPath;
            imgDisplay.style.display = 'block';
            imgDisplay.classList.remove('zoomed');
            
            titleDisplay.textContent = title;
        }

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeBtn.textContent = '🌙 Dark Mode';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeBtn.textContent = '☀️ Light Mode';
            }
        }

        function toggleZoom(img) {
            img.classList.toggle('zoomed');
        }

        function openFullscreen() {
            if (!currentImgSrc) return;
            fsImg.src = currentImgSrc;
            fsOverlay.classList.add('active');
        }

        function closeFullscreen() {
            fsOverlay.classList.remove('active');
        }

        // Add keyboard support for presentation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && fsOverlay.classList.contains('active')) {
                closeFullscreen();
            }
            
            // Arrow keys to navigate
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                const items = Array.from(document.querySelectorAll('.diagram-item'));
                const currentIndex = items.findIndex(el => el.classList.contains('active'));
                
                let nextIndex = currentIndex;
                if (e.key === 'ArrowDown' && currentIndex < items.length - 1) nextIndex++;
                if (e.key === 'ArrowUp' && currentIndex > 0) nextIndex--;
                
                if (currentIndex !== nextIndex) {
                    items[nextIndex].click();
                    items[nextIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        });
    </script>
</body>
</html>
